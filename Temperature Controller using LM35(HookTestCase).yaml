solution: |-
  from machine import ADC, Pin

  adc = ADC(Pin(34))
  adc.atten(ADC.ATTN_11DB)
  adc.width(ADC.WIDTH_12BIT)

  led = Pin(2, Pin.OUT)

  raw_value = adc.read()
  Vref = 3.3
  temp_c = (raw_value / 4095) * Vref * 100

  temp_threshold = 20
  if temp_c >= temp_threshold:
      led.on()
  else:
      led.off()
